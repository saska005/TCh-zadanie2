name: Zadanie2

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' 
  workflow_dispatch: 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the source repo
        uses: actions/checkout@v4
      
      # Ustawienie QEMU i ustawienie Buildx
      - name: Set up QEMU
        uses: actions/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      # Logowanie do ghcr
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Logowanie do DockerHub
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Definicja metadanych i tagowania
      - name: Docker metadata definitions
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tch-zadanie2
          flavor: latest=true
          tags: |
            type=sha,priority=100,prefix=sha-,format=short
            type=semver,priority=200,pattern={{version}}

      # Lokalny build i Skanowanie CVE
      - name: Build local image for CVE scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: local-test-image:latest
          cache-from: type=registry,ref=docker.io/${{ vars.DOCKERHUB_USERNAME }}/tch-zadanie2-cache:cache

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local-test-image:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Wieloarchitekturalny build z użyciem cache registry w trybie max
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=docker.io/${{ vars.DOCKERHUB_USERNAME }}/tch-zadanie2-cache:cache
          cache-to: type=registry,ref=docker.io/${{ vars.DOCKERHUB_USERNAME }}/tch-zadanie2-cache:cache,mode=max
